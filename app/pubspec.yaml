name: rewind
description: "Twitch Livestream Archive"
publish_to: 'none'

# CI builds take their version from the git tag (--build-name).
version: 1.0.0+1

# What pubspec.lock needs (see its "sdks" section): an older Flutter stops at
# `pub get` with a clear message instead of failing later. CI pins the same
# version (.github/workflows/app.yml).
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7 # native libmpv for media_kit, not imported
  http: ^1.6.0
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700

# App icons: python tool/make_icons.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 21
  ios: false
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#09090B"
    theme_color: "#8B5CF6"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
