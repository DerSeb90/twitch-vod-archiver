name: Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      # Release signing. Without these secrets the APK is signed with a
      # throwaway debug key and cannot be installed over a previous version.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          clean() { printf %s "$1" | tr -d '\r\n'; }  # tolerate secrets saved with line endings
          clean "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$(clean "$KEYSTORE_PASSWORD")" "$(clean "$KEY_ALIAS")" "$(clean "$KEY_PASSWORD")" > android/key.properties
      # one APK per CPU architecture (smaller); the in-app updater picks the matching one
      - run: flutter build apk --release --split-per-abi --build-name=${{ steps.v.outputs.name }} --build-number=${{ github.run_number }}
      - name: Verify signature
        if: env.HAS_KEY == 'true'
        env: { HAS_KEY: "${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" }
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do "$apksigner" verify --print-certs "$apk" | head -2; done
      - uses: actions/upload-artifact@v7
        with: { name: rewind-android, path: app/build/app/outputs/flutter-apk/app-*-release.apk }

  windows:
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults: { run: { working-directory: app, shell: pwsh } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Version
        id: v
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value }
          "name=$v" >> $env:GITHUB_OUTPUT
      - run: flutter build windows --release --build-name=${{ steps.v.outputs.name }} --build-number=${{ github.run_number }}
      - name: Bundle MSVC runtime
        # Flutter apps need the VC++ runtime; ship it so the app runs on a clean Windows
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Installer (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.v.outputs.name }}" windows/installer/rewind.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/installer/Rewind-Windows-Portable-${{ steps.v.outputs.name }}.zip
      - uses: actions/upload-artifact@v7
        with: { name: rewind-windows, path: app/build/installer/* }

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
